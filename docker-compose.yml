version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledger-network

networks:
  ledger-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
